<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-coin.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-coin.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fff3e6" />
    <meta name="description" content="Expense tracking for people who hate expense tracking." />
    <title>Lazy Ledger</title>
    <script>
      // Apply the saved light/dark choice before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem("lazy-ledger.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        // Status bar: black in dark mode, peach in light (kept in step by src/lib/theme.ts).
        var dark = t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
