name: Deploy Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  # Run it by hand from the Actions tab, e.g. after changing a secret.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: lxsbqzuotutpyoeiskyu
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" asks GitHub's API on every run and can hit its rate limit.
          version: 2.122.0
      - run: supabase link --project-ref $PROJECT_REF
      - run: supabase db push
      - run: supabase functions deploy parse-expense
      - run: supabase functions deploy parse-receipt
      - run: supabase functions deploy capture --no-verify-jwt
