# Minimal Supabase CLI config. Anything not set here uses the CLI defaults.
project_id = "lazy-ledger"

[functions.parse-expense]
verify_jwt = true

[functions.parse-receipt]
verify_jwt = true

[functions.parse-statement]
verify_jwt = true

# The phone has no Supabase login; capture checks its own phone token instead.
[functions.capture]
verify_jwt = false
